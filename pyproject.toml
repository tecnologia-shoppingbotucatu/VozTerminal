[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vozterminal"
version = "0.1.0"
description = "Ditado por voz para terminais Linux"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pyaudio>=0.2.14",
    "webrtcvad-wheels>=2.0.14",
    "groq>=0.11.0",
    "openai>=1.40.0",
    "pynput>=1.7.6",
    "click>=8.1.0",
]

[project.scripts]
vozterminal = "vozterminal.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
